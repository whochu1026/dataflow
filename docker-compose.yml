services:
  postgres:
    image: postgres:16-alpine
    container_name: dataflow-postgres
    environment:
      POSTGRES_USER: dataflow
      POSTGRES_PASSWORD: dataflow
      POSTGRES_DB: dataflow
    ports:
      - '5434:5432'
    volumes:
      - dataflow_pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dataflow']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: dataflow-redis
    ports:
      - '6381:6379'
    volumes:
      - dataflow_redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  dataflow_pg:
  dataflow_redis:
